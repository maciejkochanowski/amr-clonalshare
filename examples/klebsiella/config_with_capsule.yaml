# Klebsiella pneumoniae case study, n = 1500.
#
# Data provenance, licence and known reproducibility gaps: DATA_PROVENANCE.md
# in this directory. The genotype calls derive from Lam et al. (2021),
# Nat Commun 12:4188, and are redistributed under CC BY 4.0; the MIT licence of
# this repository covers the code only.
#
#   amr-clonalshare --config examples/klebsiella/config.yaml --results-dir out/
#
# Three deliberate choices, each of which changes the answer and each of which
# is therefore stated here rather than left to a default:
#
#  * The virulence layer is collapsed to locus level (ybt, clb, iuc, iro, rmp).
#    The uncollapsed 38-gene encoding weights each locus by its gene count -
#    yersiniabactin alone would carry 11 of 38 columns - and reports a single
#    ICEKp integration as 11 independent FDR-significant discoveries. The unit
#    of inference in K. pneumoniae is the mobile element, not the gene.
#
#  * No prevalence floor (lo: 0.0, min_count: 2). A 2 % floor deletes colistin,
#    tigecycline, fosfomycin and the inhibitor-resistant beta-lactamases from
#    this cohort - i.e. exactly the emergent, last-line determinants that AMR
#    surveillance exists to detect. Features present in fewer than two isolates
#    still cannot inform a distance and are reported in layer_reports.gated_out.
#
#  * K locus and O antigen are declared as one_hot layers but are NOT clustered
#    on. Every isolate has exactly one K locus, so the block is a categorical
#    variable with 78 levels: after one-hot expansion its effective dimension is
#    76, against 5.2 for AMR and 2.5 for the collapsed virulence layer, and a
#    matching-coefficient distance over it is essentially a hard "same K locus"
#    indicator. Including it made a K-locus majority-vote rule reproduce the
#    fused partition at ARI 0.81, importing clonal structure wholesale (K locus
#    is a lineage marker: AMI(K_locus, ST) = 0.35). Capsule is therefore scored
#    as an external annotation, alongside the Kleborate scores, rather than used
#    to build the partition. `examples/klebsiella/config_with_capsule.yaml`
#    keeps it as a clustering layer for the sensitivity run reported in the
#    manuscript.

dataset:
  name: klebsiella_kleborate_n1500_with_capsule
  strain_id_column: Strain_ID
  data_dir: data
  strain_alignment_policy: intersect_core
  expected_n: 1500
  metadata: metadata.csv
  lineage_column: ST
  external_columns: [virulence_score, resistance_score, K_locus, Convergence_event]

files:
  amr:
    path: amr.csv
    kind: wide_binary
    # never gated out: these are the surveillance targets
    protected: [Bla_Carb, Col, Tgc, Fcyn]
  vir:
    path: vir.csv
    kind: wide_binary
    groups:
      ybt: [ybtS, ybtX, ybtQ, ybtP, ybtA, irp2, irp1, ybtU, ybtT, ybtE, fyuA]
      clb: [clbA, clbB, clbC, clbD, clbE, clbF, clbG, clbH, clbI, clbL, clbM,
            clbN, clbO, clbP, clbQ]
      iuc: [iucA, iucB, iucC, iucD, iutA]
      iro: [iroB, iroC, iroD, iroN]
      rmp: [rmpA, rmpD, rmpC]
  kloc:
    path: kloc.csv
    kind: one_hot
  otype:
    path: otype.csv
    kind: one_hot

distance:
  metric: jaccard
  undefined_pair: identical    # see docs/methodology.md; the sensitivity run
                               # uses `distinct` and is reported in the paper
  one_hot_metric: simple_matching

snf:
  K: 30
  mu: 0.5
  T: 20
  alpha: 0.5
  tie_policy: inclusive

trait_cluster:
  layers: [amr, vir, kloc]
  k_range: [2, 3, 4, 5]
  k_select_primary: mdl
  collapse_feature_groups: true
  prevalence_gate: { lo: 0.0, hi: 1.0, min_count: 2 }
  defining: { min_abs_cohens_h: 0.5, q_fdr: 0.05, min_support: 3 }
  stability: { tau_robust: 0.4, tau_fragile: 0.1 }

tva:
  enabled: true
  # Each split re-runs the per-layer distances and the cross-diffusion fusion on
  # the discovery features, so the test concerns the same procedure that produced
  # the reported partition. That costs one fusion per split.
  n_splits: 15
  n_boot_continuum: 99
  continuum_q_max: 4
  merge: exchangeable_ruger
  dispersion: mom

influence:
  enabled: true
  n_perm: 10
  collapse_threshold: 1.5

validation:
  cluster_ari_min: 0.80
