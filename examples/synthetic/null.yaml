# Synthetic NULL cohort: 180 isolates, no clusters at all (k_true = 1).
# This is the negative control. A pipeline that reports archetypes here is
# reporting noise. Expected: selected_k = 1 (MDL gain <= 0 at every k) and
# no validated defining features.
#
#   amr-clonalshare --config examples/synthetic/null.yaml --results-dir out/

dataset:
  name: synthetic_null_k1
  strain_id_column: isolate
  data_dir: data/null
  strain_alignment_policy: intersect_core
  metadata: metadata.csv
  lineage_column: lineage
  external_columns: [planted_cluster]

files:
  amr: { path: amr.csv, kind: wide_binary }
  vir: { path: vir.csv, kind: wide_binary }

distance:
  metric: jaccard
  undefined_pair: identical      # stated, not assumed; see docs/methodology.md

snf:
  K: 20
  mu: 0.5
  T: 20
  tie_policy: inclusive          # order-invariant neighbour selection

trait_cluster:
  layers: [amr, vir]
  k_range: [2, 3, 4, 5]
  k_select_primary: mdl
  prevalence_gate: { lo: 0.0, hi: 1.0, min_count: 2 }

tva:
  n_splits: 25
  n_boot_continuum: 99
  continuum_q_max: 4
  merge: exchangeable_ruger

influence:
  n_perm: 10

validation:
  cluster_ari_min: 0.80
