# Development positive control with three planted archetypes (k_true = 3,
# overlap = 0.10). The earlier overlap = 0.05 design collapsed into only three
# correlation blocks, making valid held-out feature splitting impossible. The
# revised noise level was chosen from split geometry, not from a desired
# p-value; an independent seed is frozen in planted_confirmation.yaml.
#
#   python examples/synthetic/make_data.py
#   amr-clonalshare --config examples/synthetic/planted.yaml --results-dir out/

dataset:
  name: synthetic_planted_k3
  strain_id_column: isolate
  data_dir: data/planted
  strain_alignment_policy: intersect_core
  expected_n: 240
  metadata: metadata.csv
  lineage_column: lineage
  external_columns: [planted_cluster]

files:
  amr: { path: amr.csv, kind: wide_binary }
  vir: { path: vir.csv, kind: wide_binary }

distance:
  metric: jaccard
  undefined_pair: identical      # stated, not assumed; see docs/methodology.md

snf:
  K: 20
  mu: 0.5
  T: 20
  tie_policy: inclusive          # order-invariant neighbour selection

trait_cluster:
  layers: [amr, vir]
  k_range: [2, 3, 4, 5]
  k_select_primary: mdl
  prevalence_gate: { lo: 0.0, hi: 1.0, min_count: 2 }

tva:
  n_splits: 25
  n_boot_continuum: 99
  continuum_q_max: 4
  merge: exchangeable_ruger

influence:
  n_perm: 10

validation:
  cluster_ari_min: 0.80
