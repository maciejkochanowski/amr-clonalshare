site_name: amr-clonalshare
site_description: The lineage share of antimicrobial susceptibility calls and of the recorded MIC ordering among the represented lineages, bounds on the lineage share of the latent MIC ordering, and descriptive comparisons of collections and lineage definitions
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Quick start: quick_start.md
  - User manual:
      - 1. Install: manual/01-install.md
      - 2. Prepare the input: manual/02-input.md
      - 3. Check the input: manual/03-check-input.md
      - 4. Run: manual/04-run.md
      - 5. Read the results: manual/05-results.md
      - 6. The lineage share, agent by agent: manual/06-clonal-share.md
      - "7. Mix or rate: two collections": manual/07-decomposition.md
      - 8. Container and reproducibility: manual/08-container.md
      - 9. Exit codes and troubleshooting: manual/09-troubleshooting.md
      - 10. Three workflow recipes: manual/10-workflows.md
      - 11. Tutorial on a public collection: manual/11-tutorial.md
      - 12. Reporting checklist: manual/12-reporting-checklist.md
      - 13. The local form and the Windows folder: manual/13-local-form.md
  - Methods: methodology.md
  - API reference: api.md
  - Code metadata: CODE_METADATA.md

