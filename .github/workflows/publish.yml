# Builds the distribution once, checks it, and publishes it to PyPI from a
# separate job that holds nothing but the permission to mint an OpenID token.
#
# There is no API token anywhere in this repository. PyPI is configured to
# trust this workflow (Trusted Publishing: the project's publisher is this
# repository, this file name, and the `pypi` environment), and every uploaded
# file carries a signed provenance attestation (PEP 740) that ties it to the
# commit and the run that built it. Anyone can verify an installed release
# against that attestation with `pypi-attestations verify`.
#
# Publishing runs only when started by hand from the Actions tab. Pushing a tag does not publish;
# creating the release is the deliberate act.
name: Publish

on:
  # Every published GitHub release publishes to PyPI once the trusted
  # publisher for this repository, this file and the `pypi` environment
  # exists; until then, or for a release that predates it, run it from the
  # Actions tab against the release tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Wheel build number. PyPI records every file name it has ever
          accepted and never takes one twice, so a version whose files are
          already on the index can only be replaced by a wheel carrying a
          build number. The version is unchanged; only the file name
          differs, and pip prefers the higher build number. Leave empty for
          a first upload.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Stamp the wheel with a build number, if one was given
        if: inputs.build_number != ''
        run: |
          python -m pip install --upgrade wheel
          python -m wheel tags --build '${{ inputs.build_number }}' --remove dist/*.whl
          rm -f dist/*.tar.gz
          python -m twine check --strict dist/*
          ls -l dist/

      - name: The version in the metadata is the version in the tag
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"',
                           open("src/amr_clonalshare/__init__.py").read()).group(1)
          if not (tag == pyproject == init):
              sys.exit(f"tag {tag}, pyproject {pyproject}, __init__ {init}: not one version")
          print("version", tag)
          PY
      - name: The wheel installs and answers
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --no-deps dist/*.whl
          /tmp/probe/bin/pip install dist/*.whl
          /tmp/probe/bin/amr-clonalshare --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amr-clonalshare/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true
