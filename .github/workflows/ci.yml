# CI for amr-clonalshare.
#
# The contract this workflow enforces is deliberately NOT byte-identity of the
# outputs. A floating-point spectral pipeline does not reproduce bit-for-bit
# across BLAS and scikit-learn builds, and the previous workflow's `diff` gate
# could never be green. What is enforced instead is the set of properties the
# scientific claims actually rest on:
#
#   * the fast test suite passes on 3.10-3.12;
#   * the pipeline is equivariant under input row order (a property, not a hash);
#   * the negative control returns "no clusters" and the positive control
#     recovers the planted truth;
#   * cluster_result.json is valid RFC 8259 JSON that a non-Python parser reads;
#   * no module imports a sibling tool package (checked by AST, not by grep, so
#     a docstring mention cannot trip it);
#   * the Monte-Carlo calibration study runs and its type-I estimates hold.

name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phylo]"
      - name: Fast test suite with coverage
        run: pytest -m "not slow" -q --cov=src/amr_clonalshare --cov-report=term-missing --cov-fail-under=70
      - name: Import isolation (AST, not grep)
        run: python scripts/check_isolation.py
      - name: Controls behave as controls
        run: |
          python examples/synthetic/make_data.py
          python scripts/check_controls.py
      - name: Output contract
        run: |
          python - <<'PY'
          import json, math
          d = json.load(open('/tmp/ci_planted/cluster_result.json'))
          assert d['schema_version'] == '1.0'
          for key in ('selected_k','k_selection','layer_reports','artifact_diagnostics',
                      'layer_influence','baselines','post_clustering_inference','config'):
              assert key in d, key
          text = open('/tmp/ci_planted/cluster_result.json').read()
          assert 'NaN' not in text and 'Infinity' not in text
          print('output contract OK')
          PY
      - name: Strict JSON parse from a non-Python parser
        run: node -e "JSON.parse(require('fs').readFileSync('/tmp/ci_planted/cluster_result.json','utf8')); console.log('node JSON.parse OK')"

  calibration:
    name: Monte-Carlo calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phylo]"
      - name: Slow tests (calibration)
        run: pytest -m slow -q
      - name: Calibration study (quick)
        run: python benchmarks/calibration_study.py --quick --out /tmp/calib
      - uses: actions/upload-artifact@v4
        with:
          name: calibration
          path: /tmp/calib

  container:
    name: container reproduces the controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned image
        run: docker build -t amr-clonalshare:1.0.0 .
      - name: The entry point answers
        run: docker run --rm amr-clonalshare:1.0.0 --version
      - name: Input check on the planted control
        run: docker run --rm amr-clonalshare:1.0.0 --config examples/synthetic/planted.yaml --check-input
      - name: Positive and negative controls inside the image
        run: |
          mkdir -p /tmp/ctr && chmod 777 /tmp/ctr
          docker run --rm -v /tmp/ctr:/out amr-clonalshare:1.0.0 --config examples/synthetic/planted.yaml --results-dir /out/planted --quiet --threads 1
          docker run --rm -v /tmp/ctr:/out amr-clonalshare:1.0.0 --config examples/synthetic/null.yaml --results-dir /out/null --quiet --threads 1
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/ctr/planted/summary.json'))
          n = json.load(open('/tmp/ctr/null/summary.json'))
          assert p['selected_k'] == 3, p['selected_k']
          assert n['selected_k'] == 1, n['selected_k']
          assert open('/tmp/ctr/planted/report.md').read().startswith('# amr-clonalshare run report')
          print('container controls OK: planted k=3, null k=1')
          PY
