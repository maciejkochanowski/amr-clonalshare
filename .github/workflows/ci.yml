# CI for amr-clonalshare.
#
# The contract this workflow enforces is the set of properties the scientific
# claims rest on:
#
#   * the fast test suite passes on 3.11-3.13, with a coverage floor per module;
#   * the planted control separates the agents that follow the lineage from
#     the one that does not, and its permuted-label control manufactures no
#     share;
#   * clonal_share_result.json is valid RFC 8259 JSON that a non-Python parser
#     reads;
#   * the container image reproduces the shares of the shipped record;
#   * the Monte-Carlo calibration of the exact interval holds.

name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Dead code, unused arguments, undefined names
        run: ruff check .
      - name: The annotations are checked, not decorative
        # NumPy's stubs use the `type` statement, which mypy reads only when
        # it runs on 3.12 or later; one job is enough, the annotations do
        # not change with the interpreter.
        if: matrix.python == '3.12'
        run: mypy
      - name: Fast test suite with coverage
        run: pytest -m "not slow" -q --cov=src/amr_clonalshare --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage floors, per module
        run: python scripts/check_coverage_floors.py coverage.json
      - name: The shipped cohort passes the input check
        run: amr-clonalshare --config examples/ssuis/config.yaml --check-input --results-dir /tmp/ci_qc
      - name: The planted control behaves as a control
        run: python scripts/check_controls.py --out /tmp/ci_planted
      - name: Output contract
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/ci_planted/clonal_share_result.json'))
          assert d['schema_version'] == '1.0'
          md = d['metadata_diagnostics']
          for key in ('lineage_column', 'clonal_share', 'lineage_evidence',
                      'lineage_resolved_prevalence', 'trait_concentration'):
              assert key in md, key
          assert 'sequential' in md['lineage_evidence']
          text = open('/tmp/ci_planted/clonal_share_result.json').read()
          assert 'NaN' not in text and 'Infinity' not in text
          print('output contract OK')
          PY
      - name: Strict JSON parse from a non-Python parser
        run: node -e "JSON.parse(require('fs').readFileSync('/tmp/ci_planted/clonal_share_result.json','utf8')); console.log('node JSON.parse OK')"

  docs:
    name: documentation builds strictly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Every page, link and docstring reference resolves
        run: mkdocs build --strict

  calibration:
    name: Monte-Carlo calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Slow tests (calibration)
        run: pytest -m slow -q
      - name: Attribution calibration (quick)
        run: python benchmarks/attribution_calibration.py --quick --out /tmp/calib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration
          path: /tmp/calib

  container:
    name: container reproduces the shipped cohort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the pinned image
        run: docker build -t amr-clonalshare:1.0.0 .
      - name: The entry point answers
        run: docker run --rm amr-clonalshare:1.0.0 --version
      - name: Input check on the shipped cohort
        run: docker run --rm amr-clonalshare:1.0.0 --config examples/ssuis/config.yaml --check-input
      - name: The shipped cohort inside the image
        run: |
          mkdir -p /tmp/ctr && chmod 777 /tmp/ctr
          docker run --rm -v /tmp/ctr:/out amr-clonalshare:1.0.0 --config examples/ssuis/config.yaml --results-dir /out/ssuis --quiet --threads 1
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/ctr/ssuis/clonal_share_result.json'))
          share = r['metadata_diagnostics']['clonal_share']
          assert r['n_isolates'] == 677, r['n_isolates']
          assert len(share) == 13, len(share)
          # The counts alone do not say the image reproduces the record. The
          # per-agent share does, and it is the number the article quotes.
          expected = json.load(
              open('examples/ssuis/expected/clonal_share_result.json'))
          want = expected['metadata_diagnostics']['clonal_share']
          assert sorted(share) == sorted(want), (sorted(share), sorted(want))
          for agent in sorted(want):
              got, ref = share[agent]['kappa_adj'], want[agent]['kappa_adj']
              assert abs(got - ref) < 1e-9, (agent, got, ref)
          assert open('/tmp/ctr/ssuis/report.md').read().startswith('# amr-clonalshare run report')
          print('container OK: 677 isolates, 13 antimicrobials, kappa_adj '
                'matches the shipped record, report written')
          PY
