[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-clonalshare"
version = "1.0.0"
description = "Observational summaries of antimicrobial phenotypes by recorded lineage, with explicit phenotype definitions, input diagnostics, collection bounds and model-specific uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "Licence.txt"]
authors = [{ name = "Maciej Kochanowski", email = "maciej.kochanowski@piwet.pulawy.pl" }]
keywords = ["bioinformatics", "antimicrobial-resistance", "veterinary-surveillance", "variance-component", "population-structure", "typing-resolution", "intraclass-correlation", "prevalence-decomposition", "kitagawa-decomposition", "interval-censored-mic", "anytime-valid-inference", "streptococcus-suis", "serovar", "ncbi-pathogen-detection", "reproducible-research"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
]

# Pure core stack, no heavy optional dependencies. The floors follow the
# scientific-Python support window (SPEC 0): the interpreter and the numerical
# stack of the last two to three years. Every reported number was produced on
# a stack inside these floors, recorded in requirements-lock.txt and in the
# receipts beside the results.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# Reading a spreadsheet is a convenience, not part of the analysis, so it stays
# out of the core install: `pip install "amr-clonalshare[excel]"` adds it, and a
# run given a workbook without it is refused with that instruction.
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    # The oracles of tests/test_high_precision_oracles.py recompute the
    # package's numbers at forty digits; nothing the package ships needs it.
    "mpmath>=1.3",
    # The workbook reader is an optional extra for a user and a requirement
    # for the tests, which read a real .xlsx rather than a mocked one.
    "openpyxl>=3.1",
    # examples/ssuis/link_source_lineages.py scores the lineage join with
    # adjusted mutual information; the package itself does not import it
    "scikit-learn>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # release tooling only; not imported by the package
    "build>=1.0",
]
docs = [
    "mkdocs-material==9.5.39",
    "mkdocstrings[python]==1.0.6",
]

[project.urls]
Homepage = "https://github.com/maciejkochanowski/amr-clonalshare"
Documentation = "https://github.com/maciejkochanowski/amr-clonalshare/tree/main/docs"
Repository = "https://github.com/maciejkochanowski/amr-clonalshare"
Issues = "https://github.com/maciejkochanowski/amr-clonalshare/issues"
Changelog = "https://github.com/maciejkochanowski/amr-clonalshare/blob/main/CHANGELOG.md"

[project.scripts]
amr-clonalshare-mic = "amr_clonalshare.mic_inference_cli:main"
amr-clonalshare-compare = "amr_clonalshare.comparison:main"
amr-clonalshare = "amr_clonalshare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amr_clonalshare*"]

[tool.setuptools.package-data]
amr_clonalshare = ["general_probit_protocol.json", "validation_grid.json", "population_probit_validation.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" first so a run inside a mutated copy imports that copy, not an
# installed one; in the working tree both resolve to the same directory.
pythonpath = ["src", "."]
markers = [
    "slow: Monte-Carlo calibration and large-cohort runs; deselect with -m 'not slow'",
    "real_calibration: run the calibrated MIC interval inside the pipeline",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Correctness and dead code only. Formatting is not enforced: the docstrings
# carry the calibration evidence and are wrapped for reading, not for a
# formatter. ERA and RUF100 keep commented-out code and stale suppressions out.
select = ["E9", "E402", "F", "ARG", "ERA", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# A stub that replaces a real function has to keep that function's signature.
"tests/*" = ["ARG"]
# The benchmark drivers pass interchangeable callbacks through one
# signature and put the package on sys.path before importing it.
"benchmarks/*" = ["ARG", "E402"]

[tool.mypy]
# The package is checked as it is annotated. Third-party stubs are not
# required: the numerical stack is typed loosely and a missing stub is not a
# defect in this code.
files = ["src/amr_clonalshare"]
# NumPy's stubs use the `type` statement, which mypy parses only for a target
# of 3.12 or later; the code itself uses nothing newer than 3.11.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The source hash of this file is recorded in general_probit_protocol.json and
# checked at run time; mypy cannot narrow importlib's optional ModuleSpec/loader
# values of its dynamic loader.
module = "amr_clonalshare._general_probit.profile_bootstrap.bootstrap"
disable_error_code = ["arg-type", "union-attr"]

[tool.mutmut]
# Mutation testing is run by hand on the modules whose arithmetic carries a
# reported number; it is too slow for every push. `mutmut run` mutates the
# files below and runs the tests that cover each mutant. The score recorded in
# CONTRIBUTING.md is the last run.
# Every module whose arithmetic carries a number the report prints and whose
# tests can kill a mutant in seconds. The MIC likelihood and the probit
# numerics are left out because one mutant there costs a model fit; the
# independent-reference tests, the high-precision oracles of
# tests/test_high_precision_oracles.py and the simulation campaigns do that
# work instead. The normal-tail helpers are in because the oracles gave them a
# reference that fails in twelve seconds rather than in a fit.
source_paths = ["src/amr_clonalshare/stats.py", "src/amr_clonalshare/clonality.py",
                "src/amr_clonalshare/attribution.py", "src/amr_clonalshare/realised.py",
                "src/amr_clonalshare/evalues.py", "src/amr_clonalshare/latent.py",
                "src/amr_clonalshare/missingness.py", "src/amr_clonalshare/qc.py",
                "src/amr_clonalshare/phenotype.py", "src/amr_clonalshare/comparison.py",
                "src/amr_clonalshare/draft.py", "src/amr_clonalshare/_normal_numerics.py"]
# The copy mutmut works in must carry everything a test opens, or the stats
# pass fails on a missing fixture rather than on a mutant.
also_copy = ["src/amr_clonalshare/", "benchmarks/", "examples/", "scripts/", ".github/",
             "docs/", ".dockerignore", ".gitignore", ".zenodo.json", "CHANGELOG.md",
             "CITATION.cff", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "Dockerfile",
             "LICENSE", "Licence.txt", "MANIFEST.in", "README.md", "REPRODUCIBILITY.md",
             "mkdocs.yml", "requirements-lock.txt"]
pytest_add_cli_args_test_selection = ["tests/", "-p", "no:cacheprovider", "--no-cov"]
