[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-clonalshare"
version = "1.0.0"
description = "Lineage-conditioned diagnostics for bacterial resistance patterns and prevalence trends: fail-closed multi-layer trait clustering, and a Kitagawa decomposition splitting a non-wild-type prevalence difference into lineage-composition and within-lineage rate components."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "Licence.txt"]
authors = [{ name = "M. Kochanowski", email = "maciej.kochanowski@piwet.pulawy.pl" }]
keywords = ["bioinformatics", "antimicrobial-resistance", "veterinary-surveillance", "prevalence-decomposition", "kitagawa-decomposition", "population-structure", "trait-clustering", "similarity-network-fusion", "selective-inference", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
]

# Pure core stack — no heavy optional dependencies.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pyyaml>=5.4",
    "pandera>=0.18",
]

[project.optional-dependencies]
phylo = ["dendropy>=4.5"]
plot = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "dendropy>=4.5",
    "matplotlib>=3.5",
    # release tooling only; not imported by the package
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/maciejkochanowski/amr-clonalshare"
Documentation = "https://maciejkochanowski.github.io/amr-clonalshare/"
Repository = "https://github.com/maciejkochanowski/amr-clonalshare"
Issues = "https://github.com/maciejkochanowski/amr-clonalshare/issues"
Changelog = "https://github.com/maciejkochanowski/amr-clonalshare/blob/main/CHANGELOG.md"

[project.scripts]
amr-clonalshare = "amr_clonalshare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amr_clonalshare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: Monte-Carlo calibration and large-cohort runs; deselect with -m 'not slow'",
]
addopts = "-ra"
